$kind: http-request
name: 'categories respect the strict scope'
method: GET
url: '{{base_url}}/categories'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('categories respond 200', () => pm.response.to.have.status(200));
      pm.test('banned departments never appear (brief rule)', () => {
        const titles = pm.response.json().map((c) => c.title.toLowerCase()).join(' ');
        for (const banned of ['kitchen', 'dining', 'home & living', 'stationery', 'school suppl']) {
          pm.expect(titles, 'must not contain "' + banned + '"').to.not.include(banned);
        }
      });
